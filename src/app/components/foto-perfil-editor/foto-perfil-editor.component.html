<div class="foto-perfil card">
  <div class="card-body d-flex flex-column flex-sm-row align-items-center gap-3">
    <div class="foto-perfil__avatar">
      <app-avatar-usuario [usuarioId]="usuarioId()" [foto]="foto()" [nombre]="nombre()" [tamano]="120" />
      @if (editable()) {
        <button
          type="button"
          class="foto-perfil__editar"
          aria-label="Cambiar fotografía"
          title="Cambiar fotografía"
          [disabled]="eliminando()"
          (click)="abrirSelector()"
        >
          <i class="fa fa-camera" aria-hidden="true"></i>
        </button>
      }
    </div>

    <div class="text-center text-sm-start flex-grow-1">
      <h4 class="mb-1">{{ nombre() }}</h4>
      @if (editable()) {
        <p class="text-muted mb-2 small">JPG, PNG o WEBP. Máximo 5 MB, mínimo 200 x 200 píxeles.</p>
        <div class="d-flex flex-wrap justify-content-center justify-content-sm-start gap-2">
          <button type="button" class="btn btn-primary btn-sm" [disabled]="eliminando()" (click)="abrirSelector()">
            <i class="fa fa-upload me-1" aria-hidden="true"></i>
            {{ tieneFoto() ? 'Cambiar fotografía' : 'Subir fotografía' }}
          </button>
          @if (tieneFoto()) {
            <button type="button" class="btn btn-outline-danger btn-sm" [disabled]="eliminando()" (click)="eliminar()">
              <i class="fa fa-trash me-1" aria-hidden="true"></i> Eliminar fotografía
            </button>
          }
        </div>
      }
    </div>
  </div>
</div>

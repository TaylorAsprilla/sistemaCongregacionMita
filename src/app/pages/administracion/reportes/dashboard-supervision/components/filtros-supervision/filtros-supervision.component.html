<form class="filtros" (ngSubmit)="enviar()" aria-label="Filtros del dashboard">
  <div class="grupo-filtros">
    <div class="encabezado-grupo">
      <span class="numero-grupo">1</span>
      <div>
        <h3>Periodo</h3>
        <p>Seleccione el periodo del informe y la comparación.</p>
      </div>
    </div>
    <div class="row g-3 align-items-end">
      <div class="col-6 col-lg-2">
        <label class="form-label" for="filtroAnio">Año</label>
        <select id="filtroAnio" class="form-select" name="anio" [ngModel]="anio()" (ngModelChange)="anio.set($event)">
          @for (a of disponibles().anios; track a) {
            <option [ngValue]="a">{{ a }}</option>
          }
        </select>
      </div>

      <div class="col-6 col-lg-2">
        <label class="form-label" for="filtroTrimestre">Trimestre</label>
        <select id="filtroTrimestre" class="form-select" name="trimestre" [ngModel]="trimestre()"
          (ngModelChange)="trimestre.set($event)">
          @for (t of disponibles().trimestres; track t.valor) {
            <option [ngValue]="t.valor">{{ t.etiqueta }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-lg-4">
        <label class="form-label" for="filtroComparacion">Comparar con</label>
        <select id="filtroComparacion" class="form-select" name="comparacion" [ngModel]="comparacion()"
          (ngModelChange)="comparacion.set($event)">
          @for (c of disponibles().comparaciones; track c.valor) {
            <option [ngValue]="c.valor">{{ c.etiqueta }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="grupo-filtros grupo-alcance">
    <div class="encabezado-grupo">
      <span class="numero-grupo">2</span>
      <div>
        <h3>Alcance organizativo</h3>
        <p>Limite los resultados por país, ciudad o campo.</p>
      </div>
    </div>
    <div class="row g-3 align-items-end">
      @if (!paisFijo()) {
        <div class="col-12 col-md-4 col-lg-3">
          <label class="form-label" for="filtroPais">Congregación País</label>
          <select id="filtroPais" class="form-select" name="pais" [ngModel]="paisId()" (ngModelChange)="cambiarPais($event)">
            <option [ngValue]="null">Todos los países</option>
            @for (p of disponibles().paises; track p.id) {
              <option [ngValue]="p.id">{{ p.nombre }}</option>
            }
          </select>
        </div>
      } @else {
        <div class="col-12 col-md-4 col-lg-3">
          <span class="form-label d-block">Congregación País</span>
          <div class="form-control bg-light" aria-label="País asignado">
            {{ disponibles().paises[0]?.nombre ?? 'País asignado' }}
          </div>
        </div>
      }

      <div class="col-12 col-md-4 col-lg-3">
        <label class="form-label" for="filtroCongregacion">Congregación Ciudad</label>
        <select id="filtroCongregacion" class="form-select" name="congregacion" [ngModel]="congregacionId()"
          (ngModelChange)="cambiarCongregacion($event)">
          <option [ngValue]="null">Todas las ciudades</option>
          @for (c of congregaciones(); track c.id) {
            <option [ngValue]="c.id">{{ c.nombre }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-md-4 col-lg-3">
        <label class="form-label" for="filtroCampo">Congregación Campo</label>
        <select id="filtroCampo" class="form-select" name="campo" [ngModel]="campoId()" (ngModelChange)="campoId.set($event)">
          <option [ngValue]="null">Todos los campos</option>
          @for (c of campos(); track c.id) {
            <option [ngValue]="c.id">{{ c.nombre }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-lg-3 d-flex gap-2 acciones">
        <button type="submit" class="btn btn-primary btn-sm flex-fill" [disabled]="cargando()" title="Aplicar filtros">
          <i class="fas fa-filter me-1" aria-hidden="true"></i>
          Aplicar filtros
        </button>
        <button type="button" class="btn btn-secondary btn-sm" [disabled]="cargando()" (click)="limpiar()"
          title="Volver al periodo activo y limpiar el alcance">
          <i class="fas fa-rotate-left" aria-hidden="true"></i>
          <span class="ms-1">Limpiar</span>
        </button>
      </div>
    </div>
  </div>
</form>
